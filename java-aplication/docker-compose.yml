services:

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: urlshortener
      POSTGRES_USER: urluser
      POSTGRES_PASSWORD: urlpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urluser -d urlshortener"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: "postgres -c autovacuum_vacuum_scale_factor=0.5 -c autovacuum_analyze_scale_factor=0.5 -c checkpoint_timeout=30min -c checkpoint_completion_target=0.9"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/urlshortener
      DB_USERNAME: urluser
      DB_PASSWORD: urlpass
      APP_BASE_URL: http://localhost:8080
      # V4c: SerialGC — isola GC como variavel
      # Para V4a (G1GC): JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=50.0 -XX:InitialRAMPercentage=25.0 -XX:+UseG1GC"
      # Para V4b (ZGC):  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=50.0 -XX:InitialRAMPercentage=25.0 -XX:+UseZGC -XX:+ZGenerational"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=50.0 -XX:InitialRAMPercentage=25.0 -XX:+UseSerialGC"
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    restart: unless-stopped

volumes:
  postgres_data:
