[package]
name = "rust-aplication"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
tokio    = { version = "1", features = ["full"] }
sqlx     = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "macros"] }
serde    = { version = "1",   features = ["derive"] }
rand     = "0.8"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
